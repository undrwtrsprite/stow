name: Minecraft regression tests

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Minecraft test suite
        required: true
        default: behavior
        type: choice
        options: [behavior, mining, stripping, crafting, bundles, outlines]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Prepare upstream Minecraft and Java dependencies
        run: python3 dev-tools/bootstrap-local.py
      - name: Compile the harness build
        run: python3 dev-tools/build-local.py
      - name: Run the chosen suite
        env:
          STOW_TEST_SCREENSHOTS: '0'
          STOW_AUTO_TOOL_WORLD_TEST: ${{ inputs.suite == 'mining' && '1' || '0' }}
          STOW_STRIP_WORLD_TEST: ${{ inputs.suite == 'stripping' && '1' || '0' }}
          STOW_CRAFTING_WORLD_TEST: ${{ inputs.suite == 'crafting' && '1' || '0' }}
          STOW_BUNDLE_WORLD_TEST: ${{ inputs.suite == 'bundles' && '1' || '0' }}
          STOW_NATIVE_WORLD_TEST: ${{ inputs.suite == 'outlines' && '1' || '0' }}
        run: python3 dev-tools/test-local.py
      - name: Upload Minecraft results and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: stow-${{ inputs.suite }}-results
          path: |
            ../stow-tests/game-v03-*/feature-test.log
            ../stow-tests/game-v03-*/*result.txt
          if-no-files-found: warn
          retention-days: 14
