plugins { id 'net.fabricmc.fabric-loom' version '1.17.21' }
version = '0.5.10+mc26.3'
group = 'dev.stow'
base { archivesName = 'stow' }
repositories {
    maven { url = 'https://maven.terraformersmc.com/releases/' }
    maven { url = 'https://maven.shedaniel.me/' }
}
dependencies {
    minecraft 'com.mojang:minecraft:26.3'
    implementation 'net.fabricmc:fabric-loader:0.19.5'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.161.0+26.3'
    compileOnly 'com.terraformersmc:modmenu:21.0.0'
    implementation 'me.shedaniel.cloth:cloth-config-fabric:26.3.159'
}
java { toolchain.languageVersion = JavaLanguageVersion.of(25); withSourcesJar() }
tasks.withType(JavaCompile).configureEach { options.release = 25; options.encoding = 'UTF-8' }
jar { from('LICENSE'); from('NOTICE') }
